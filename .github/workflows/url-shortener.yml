name: URL Shortener API

on:
  workflow_dispatch:
    inputs:
      shortCode:
        description: 'Short code (alphanumeric only, max 20 chars)'
        required: true
        type: string
      longUrl:
        description: 'Long URL to redirect to (must start with http:// or https://)'
        required: true
        type: string
      expirationHours:
        description: 'Expiration in hours (1-168, default: 72)'
        required: false
        type: string
        default: '72'
      metadata:
        description: 'Metadata (JSON format, max 1000 chars)'
        required: false
        type: string
        default: '{}'

jobs:
  store-mapping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
    - name: Debug - Show workflow inputs
      run: |
        echo "DEBUG: Workflow Inputs"
        echo "Short Code: ${{ github.event.inputs.shortCode }}"
        echo "Long URL: ${{ github.event.inputs.longUrl }}"
        echo "Expiration Hours: ${{ github.event.inputs.expirationHours }}"
        echo "Metadata: ${{ github.event.inputs.metadata }}"
        echo "Repository: ${{ github.repository }}"
        echo "Ref: ${{ github.ref }}"
        echo "Actor: ${{ github.actor }}"

    - name: Simple input processing (bypass complex validation)
      run: |
        echo "DEBUG: Simple input processing"
        echo "DEBUG: All inputs received"
        echo "SHORT_CODE_INPUT: '${{ github.event.inputs.shortCode }}'"
        echo "LONG_URL_INPUT: '${{ github.event.inputs.longUrl }}'"
        echo "EXPIRATION_HOURS_INPUT: '${{ github.event.inputs.expirationHours }}'"
        echo "METADATA_INPUT: '${{ github.event.inputs.metadata }}'"

        # Simple assignment - no sed, no head, no complex validation
        SHORT_CODE="${{ github.event.inputs.shortCode }}"
        LONG_URL="${{ github.event.inputs.longUrl }}"
        EXPIRATION_HOURS="${{ github.event.inputs.expirationHours }}"
        METADATA="${{ github.event.inputs.metadata }}"

        echo "DEBUG: Variables assigned"
        echo "SHORT_CODE: '$SHORT_CODE'"
        echo "LONG_URL: '$LONG_URL'"

        # Basic validation only
        if [[ -z "$SHORT_CODE" ]]; then
          echo "ERROR: Short code is empty"
          exit 1
        fi

        if [[ -z "$LONG_URL" ]]; then
          echo "ERROR: Long URL is empty"
          exit 1
        fi

        echo "DEBUG: Basic validation passed"

        # Set environment variables for next steps
        echo "SHORT_CODE=$SHORT_CODE" >> $GITHUB_ENV
        echo "LONG_URL=$LONG_URL" >> $GITHUB_ENV
        echo "EXPIRATION_HOURS=$EXPIRATION_HOURS" >> $GITHUB_ENV
        echo "METADATA=$METADATA" >> $GITHUB_ENV

        echo "DEBUG: Environment variables set"

    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    
    - name: Debug - Show repository structure
      run: |
        echo "DEBUG: Repository Structure"
        pwd
        ls -la
        echo "DEBUG: Public directory"
        ls -la public/ || echo "Public directory not found"
        echo "DEBUG: Check for url-mappings.json"
        if [ -f "public/url-mappings.json" ]; then
          echo "url-mappings.json exists"
          head -20 public/url-mappings.json
        else
          echo "url-mappings.json NOT found"
        fi

    - name: Store URL mapping
      run: |
        echo "DEBUG: Starting URL mapping storage"
        echo "DEBUG: All environment variables:"
        env | grep -E "^(SHORT_CODE|LONG_URL|EXPIRATION_HOURS|METADATA)="

        # Use validated and sanitized environment variables
        SHORT_CODE="${{ env.SHORT_CODE }}"
        LONG_URL="${{ env.LONG_URL }}"
        EXPIRATION_HOURS="${{ env.EXPIRATION_HOURS }}"
        METADATA="${{ env.METADATA }}"

        echo "DEBUG: Parsed inputs"
        echo "SHORT_CODE: '$SHORT_CODE'"
        echo "LONG_URL: '$LONG_URL'"
        echo "EXPIRATION_HOURS: '$EXPIRATION_HOURS'"
        echo "METADATA: '$METADATA'"

        # Validate inputs
        if [ -z "$SHORT_CODE" ] || [ -z "$LONG_URL" ]; then
          echo "ERROR: Missing required inputs"
          exit 1
        fi

        echo "DEBUG: Input validation passed"

        # Calculate expiration using bash only (no bc, no Node.js)
        CURRENT_TIME=$(date +%s)
        EXPIRATION_SECONDS=$((${EXPIRATION_HOURS} * 3600))
        EXPIRES_AT=$((${CURRENT_TIME} + ${EXPIRATION_SECONDS}))
        EXPIRES_AT_MS="${EXPIRES_AT}000"
        echo "DEBUG: Current time: $CURRENT_TIME"
        echo "DEBUG: Expiration seconds: $EXPIRATION_SECONDS"
        echo "DEBUG: Expiration timestamp: $EXPIRES_AT_MS"
        echo "DEBUG: Current timestamp: ${CURRENT_TIME}000"

        # Create public directory
        echo "DEBUG: Creating public directory"
        mkdir -p public
        echo "DEBUG: Directory creation successful"

        # Create timestamp using bash
        TIMESTAMP=$(date +%s)000
        echo "DEBUG: Timestamp: $TIMESTAMP"

        echo "DEBUG: About to create JSON file"

        # Test basic commands first
        echo "DEBUG: Testing basic commands"
        echo "test" > /tmp/test.txt
        if [ $? -eq 0 ]; then
          echo "DEBUG: Basic file creation works"
        else
          echo "ERROR: Basic file creation failed"
          exit 1
        fi

        # Create JSON using simple echo
        echo "DEBUG: Creating JSON with echo"
        echo '{"mappings":{"'"$SHORT_CODE"'":{"shortCode":"'"$SHORT_CODE"'","longUrl":"'"$LONG_URL"'","createdAt":'"$TIMESTAMP"',"expiresAt":'"$EXPIRES_AT_MS"',"metadata":'"$METADATA"'"}},"lastUpdated":'"$TIMESTAMP"',"version":"1.0"}' > public/url-mappings.json

        if [ $? -eq 0 ]; then
          echo "DEBUG: JSON file created successfully"
        else
          echo "ERROR: JSON file creation failed"
          exit 1
        fi

        echo "DEBUG: File contents:"
        cat public/url-mappings.json

    - name: Debug - Verify mapping was stored
      run: |
        echo "DEBUG: Verifying mapping was stored"
        if [ -f "public/url-mappings.json" ]; then
          echo "url-mappings.json exists"
          echo "DEBUG: File size: $(wc -c < public/url-mappings.json)"
          echo "DEBUG: Content preview:"
          head -30 public/url-mappings.json
          echo "DEBUG: Looking for short code: ${{ env.SHORT_CODE }}"
          if grep -q "${{ env.SHORT_CODE }}" public/url-mappings.json; then
            echo "Short code found in mappings"
            echo "DEBUG: Mapping verification successful"
          else
            echo "Short code NOT found in mappings"
            exit 1
          fi
        else
          echo "url-mappings.json was NOT created"
          exit 1
        fi

    - name: Commit and push changes
      run: |
        echo "DEBUG: Starting commit and push"
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        git add public/url-mappings.json
        git status

        if git diff --staged --quiet; then
          echo "DEBUG: No changes to commit"
        else
          echo "DEBUG: Committing changes"
          git commit -m "Add URL mapping: ${{ env.SHORT_CODE }}"
          echo "DEBUG: Pushing to repository"
          git push
        fi

    - name: Deploy to GitHub Pages
      if: success()
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        keep_files: true

    - name: Debug - Final status
      if: always()
      run: |
        echo "DEBUG: Final workflow status"
        echo "Job status: ${{ job.status }}"