name: URL Shortener Final

on:
  workflow_dispatch:
    inputs:
      shortCode:
        description: 'Short code'
        required: true
        type: string
      longUrl:
        description: 'Long URL to redirect to'
        required: true
        type: string
      expirationHours:
        description: 'Expiration in hours (default: 72)'
        required: false
        type: string
        default: '72'
      logoFileUrl:
        description: 'R2 file URL for logo download'
        required: false
        type: string
      logoExtension:
        description: 'Logo file extension (png, jpg, gif, webp)'
        required: false
        type: string
      metadata:
        description: 'Personalization metadata for cross-device use'
        required: false
        type: string
        default: '{}'
        
jobs:
  store-mapping:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
    - name: Debug - Show workflow inputs safely
      run: |
        echo "DEBUG: Workflow Inputs"
        echo "Short Code: ${{ github.event.inputs.shortCode }}"
        echo "Long URL: ${{ github.event.inputs.longUrl }}"
        echo "Expiration Hours: ${{ github.event.inputs.expirationHours }}"
        echo "Metadata (safely quoted):"
        echo "'${{ github.event.inputs.metadata }}'"
        echo "Repository: ${{ github.repository }}"
        echo "Ref: ${{ github.ref }}"
        echo "Actor: ${{ github.actor }}"

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Create logo directory structure
      run: |
        echo "DEBUG: Creating logo directory structure"
        # Create assets/logos directory if it doesn't exist
        mkdir -p public/assets/logos
        echo "DEBUG: Logo directory created: public/assets/logos"

    - name: Download logo file from R2
      if: ${{ github.event.inputs.logoFileUrl != '' }}
      run: |
        echo "DEBUG: Downloading logo from R2"
        LOGO_FILE_URL="${{ github.event.inputs.logoFileUrl }}"
        LOGO_EXTENSION="${{ github.event.inputs.logoExtension }}"
        SHORT_CODE="${{ github.event.inputs.shortCode }}"

        if [ -n "$LOGO_FILE_URL" ] && [ -n "$LOGO_EXTENSION" ] && [ -n "$SHORT_CODE" ]; then
          echo "DEBUG: Logo file URL: $LOGO_FILE_URL"
          echo "DEBUG: Logo extension: $LOGO_EXTENSION"
          echo "DEBUG: Short code: $SHORT_CODE"

          # Create logo directory
          mkdir -p public/assets/logos

          # Download file from R2
          LOGO_FILE_PATH="public/assets/logos/${SHORT_CODE}.${LOGO_EXTENSION}"

          echo "DEBUG: Starting download with retry logic"
          # Download with retry logic, timeout, and proper error handling
          MAX_RETRIES=3
          TIMEOUT=30
          RETRY_COUNT=0
          DOWNLOAD_SUCCESS=false

          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$DOWNLOAD_SUCCESS" = false ]; do
            echo "DEBUG: Download attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES"

            # Use curl with timeout, follow redirects, and show progress
            if curl -L --fail --silent --show-error --max-time $TIMEOUT \
                   --retry 2 --retry-delay 5 \
                   -o "$LOGO_FILE_PATH" \
                   "$LOGO_FILE_URL" 2>&1; then

              # Verify file exists and has content
              if [ -f "$LOGO_FILE_PATH" ]; then
                FILE_SIZE=$(stat -c%s "$LOGO_FILE_PATH" 2>/dev/null || stat -f%z "$LOGO_FILE_PATH" 2>/dev/null || echo "unknown")
                echo "DEBUG: Logo file downloaded successfully: $LOGO_FILE_PATH"
                echo "DEBUG: File size: $FILE_SIZE bytes"

                # Validate file is not empty
                if [ "$FILE_SIZE" -gt 0 ]; then
                  # Basic image file validation (check magic bytes)
                  if file "$LOGO_FILE_PATH" | grep -q "image"; then
                    echo "DEBUG: File type validation passed - confirmed as image file"
                    DOWNLOAD_SUCCESS=true
                  else
                    echo "WARNING: Downloaded file does not appear to be a valid image"
                    rm -f "$LOGO_FILE_PATH"
                  fi
                else
                  echo "ERROR: Downloaded file is empty"
                  rm -f "$LOGO_FILE_PATH"
                fi
              else
                echo "ERROR: Download completed but file not found at expected location"
              fi
            else
              echo "ERROR: Download failed with curl exit code: $?"
              RETRY_COUNT=$((RETRY_COUNT + 1))

              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "DEBUG: Waiting before retry..."
                sleep 10
              fi
            fi
          done

          if [ "$DOWNLOAD_SUCCESS" = false ]; then
            echo "ERROR: Failed to download logo file after $MAX_RETRIES attempts"
            echo "ERROR: Logo file URL was: $LOGO_FILE_URL"
            echo "ERROR: This may indicate an issue with the R2 storage or network connectivity"
            # Exit with error to fail the workflow, as logo download is critical
            exit 1
          fi

          # Set proper file permissions
          chmod 644 "$LOGO_FILE_PATH"
          echo "DEBUG: File permissions set to 644"

          # Final verification
          if [ -f "$LOGO_FILE_PATH" ] && [ -s "$LOGO_FILE_PATH" ]; then
            FINAL_SIZE=$(stat -c%s "$LOGO_FILE_PATH" 2>/dev/null || stat -f%z "$LOGO_FILE_PATH" 2>/dev/null || echo "unknown")
            echo "✅ Logo file successfully downloaded and verified: $LOGO_FILE_PATH"
            echo "✅ Final file size: $FINAL_SIZE bytes"
            echo "✅ File ready for deployment"
          else
            echo "ERROR: Final verification failed - file is missing or empty"
            exit 1
          fi

        else
          echo "DEBUG: No logo file URL provided, skipping logo download"
          if [ -z "$LOGO_FILE_URL" ]; then
            echo "DEBUG: logoFileUrl input is empty"
          fi
          if [ -z "$LOGO_EXTENSION" ]; then
            echo "DEBUG: logoExtension input is empty"
          fi
          if [ -z "$SHORT_CODE" ]; then
            echo "DEBUG: shortCode input is empty"
          fi
        fi

    - name: Store URL mapping with proper handling
      run: |
        echo "DEBUG: Starting URL mapping storage"

        # Parse inputs with proper escaping to handle complex JSON
        SHORT_CODE="${{ github.event.inputs.shortCode }}"
        LONG_URL="${{ github.event.inputs.longUrl }}"
        EXPIRATION_HOURS="${{ github.event.inputs.expirationHours }}"
        # Handle metadata safely - escape special characters
        METADATA='${{ toJSON(github.event.inputs.metadata) }}'
        # Logo data is handled separately to avoid size limits

        echo "DEBUG: Parsed inputs safely"
        echo "SHORT_CODE: $SHORT_CODE"
        echo "LONG_URL: $LONG_URL"
        echo "EXPIRATION_HOURS: $EXPIRATION_HOURS"
        echo "METADATA length: ${#METADATA}"
        echo "METADATA preview (first 200 chars): ${METADATA:0:200}..."

        # Validate metadata is not empty and is valid JSON/string
        if [ -z "$METADATA" ]; then
          echo "DEBUG: METADATA is empty, using empty object"
          METADATA="{}"
        fi

        # Ensure METADATA is properly escaped for file writing
        echo "DEBUG: METADATA type check completed"

        # Validate inputs
        if [ -z "$SHORT_CODE" ] || [ -z "$LONG_URL" ]; then
          echo "ERROR: Missing required inputs"
          exit 1
        fi

        # Calculate expiration
        EXPIRES_AT=$(node -e "console.log(Date.now() + (${EXPIRATION_HOURS} * 60 * 60 * 1000))")
        echo "DEBUG: Expiration timestamp: $EXPIRES_AT"

        # Read current mappings
        MAPPINGS_FILE="public/url-mappings.json"
        echo "DEBUG: Checking mappings file: $MAPPINGS_FILE"

        if [ -f "$MAPPINGS_FILE" ]; then
          echo "DEBUG: Reading existing mappings"
          MAPPINGS=$(cat "$MAPPINGS_FILE")
        else
          echo "DEBUG: Creating new mappings file"
          MAPPINGS='{"mappings": {}, "lastUpdated": 0, "version": "1.0", "statistics": {"totalMappings": 0, "activeMappings": 0, "expiredMappings": 0}}'
          mkdir -p public
        fi

        # Create Node script with robust metadata handling
        cat > process_mappings.cjs << 'EOF'
        const fs = require('fs');

        console.log('DEBUG: Starting Node.js processing');

        // Read all large data from temp files to avoid command line length issues
        let mappingsStr;
        try {
          if (fs.existsSync('./mappings_temp.json')) {
            mappingsStr = fs.readFileSync('./mappings_temp.json', 'utf8');
            console.log('DEBUG: Read mappings from temp file, length:', mappingsStr.length);
          } else {
            mappingsStr = process.env.MAPPINGS || '{}';
            console.log('DEBUG: Read mappings from environment, length:', mappingsStr.length);
          }
        } catch (error) {
          console.log('WARNING: Could not read mappings, using empty object');
          mappingsStr = '{"mappings": {}, "lastUpdated": 0, "version": "1.0", "statistics": {"totalMappings": 0, "activeMappings": 0, "expiredMappings": 0}}';
        }

        let metadataStr;
        try {
          if (fs.existsSync('./metadata_temp.json')) {
            metadataStr = fs.readFileSync('./metadata_temp.json', 'utf8');
            console.log('DEBUG: Read metadata from temp file, length:', metadataStr.length);
          } else {
            metadataStr = process.env.METADATA || '{}';
            console.log('DEBUG: Read metadata from environment, length:', metadataStr.length);
          }
        } catch (error) {
          console.log('WARNING: Could not read metadata, using empty object');
          metadataStr = '{}';
        }

        let longUrl;
        try {
          if (fs.existsSync('./longurl_temp.txt')) {
            longUrl = fs.readFileSync('./longurl_temp.txt', 'utf8').trim();
            console.log('DEBUG: Read long URL from temp file, length:', longUrl.length);
          } else {
            longUrl = process.env.LONG_URL || '';
            console.log('DEBUG: Read long URL from environment, length:', longUrl.length);
          }
        } catch (error) {
          console.log('WARNING: Could not read long URL, using empty string');
          longUrl = '';
        }

        try {
          metadata = JSON.parse(metadataStr);
          console.log('DEBUG: Successfully parsed METADATA as JSON');
        } catch (error) {
          console.log('DEBUG: JSON parse failed, trying JavaScript evaluation');
          console.log('DEBUG: Metadata input length:', metadataStr.length);

          try {
            // Use Function constructor for safer evaluation
            const jsObject = new Function('return ' + metadataStr)();
            metadata = jsObject;
            console.log('DEBUG: Successfully evaluated metadata as JavaScript object');
          } catch (fallbackError) {
            console.log('WARNING: Could not parse metadata, using empty object');
            metadata = {};
          }
        }

        let mappings;
        try {
          mappings = JSON.parse(mappingsStr);
          console.log('DEBUG: Successfully parsed MAPPINGS as JSON');
        } catch (error) {
          console.log('WARNING: Could not parse mappings, using default structure');
          mappings = {"mappings": {}, "lastUpdated": 0, "version": "1.0", "statistics": {"totalMappings": 0, "activeMappings": 0, "expiredMappings": 0}};
        }

        const shortCode = process.env.SHORT_CODE;
        const expiresAt = parseInt(process.env.EXPIRES_AT);

        console.log('DEBUG: Processing mapping for short code:', shortCode);
        console.log('DEBUG: Long URL:', longUrl);
        console.log('DEBUG: Expires at:', new Date(expiresAt).toISOString());
        console.log('DEBUG: Metadata:', JSON.stringify(metadata));

        // Automatic cleanup: Remove mappings older than 96 hours (345600000 ms)
        // This keeps 72-hour expiration message visible for 24 hours after expiration
        const now = Date.now();
        const cleanupThreshold = 96 * 60 * 60 * 1000; // 96 hours in milliseconds
        let cleanupCount = 0;

        console.log('DEBUG: Starting automatic cleanup of old mappings...');
        console.log('DEBUG: Current time:', new Date(now).toISOString());
        console.log('DEBUG: Cleanup threshold (96 hours):', new Date(now - cleanupThreshold).toISOString());

        Object.keys(mappings.mappings).forEach(code => {
          const mapping = mappings.mappings[code];
          const age = now - mapping.createdAt;

          if (age > cleanupThreshold) {
            console.log('DEBUG: Removing old mapping:', code, 'Age:', Math.round(age / (1000 * 60 * 60)), 'hours');
            delete mappings.mappings[code];
            cleanupCount++;
          }
        });

        console.log('DEBUG: Cleanup completed. Removed', cleanupCount, 'old mappings');

        // Process metadata for storage (personalization data for cross-device use)
        let processedMetadata = metadata;
        try {
          if (typeof processedMetadata === 'string') {
            processedMetadata = JSON.parse(processedMetadata);
          }

          // Store metadata as string for JSON storage
          processedMetadata = JSON.stringify(processedMetadata);
          console.log('DEBUG: Processed metadata for storage, length:', processedMetadata.length);
        } catch (error) {
          console.log('DEBUG: Failed to process metadata, using original:', error);
          processedMetadata = JSON.stringify({});
        }

        // Add new mapping
        mappings.mappings[shortCode] = {
          shortCode: shortCode,
          longUrl: longUrl,
          createdAt: Date.now(),
          expiresAt: expiresAt,
          metadata: processedMetadata
        };
        mappings.lastUpdated = Date.now();

        // Update statistics
        let activeCount = 0;
        let expiredCount = 0;

        Object.values(mappings.mappings).forEach(mapping => {
          if (now > mapping.expiresAt) {
            expiredCount++;
          } else {
            activeCount++;
          }
        });

        mappings.statistics = {
          totalMappings: Object.keys(mappings.mappings).length,
          activeMappings: activeCount,
          expiredMappings: expiredCount,
          lastCleanup: now,
          lastCleanupCount: cleanupCount
        };

        // Write updated mappings
        fs.writeFileSync('public/url-mappings.json', JSON.stringify(mappings, null, 2));

        console.log('URL mapping stored successfully');
        console.log('Short code:', shortCode);
        console.log('Total mappings:', Object.keys(mappings.mappings).length);
        console.log('Active mappings:', activeCount);
        console.log('Expired mappings:', expiredCount);
        console.log('Cleaned up old mappings:', cleanupCount);
        console.log('Cleanup retention: 96 hours (shows 72h expired for 24h)');
        EOF

        # Write all large data to temp files to avoid command line length issues
        # Use printf to handle complex JSON with quotes and special characters safely
        printf "%s\n" "$MAPPINGS" > mappings_temp.json
        echo "DEBUG: Wrote mappings to temp file, size: $(wc -c < mappings_temp.json)"

        printf "%s\n" "$METADATA" > metadata_temp.json
        echo "DEBUG: Wrote metadata to temp file, size: $(wc -c < metadata_temp.json)"

        printf "%s\n" "$LONG_URL" > longurl_temp.txt
        echo "DEBUG: Wrote long URL to temp file, size: $(wc -c < longurl_temp.txt)"

        # Run Node script with minimal environment variables
        export SHORT_CODE="$SHORT_CODE"
        export EXPIRES_AT="$EXPIRES_AT"
        # Don't export MAPPINGS, METADATA, and LONG_URL as environment variables - read from files instead

        node process_mappings.cjs

        # Clean up all temp files
        rm -f metadata_temp.json longurl_temp.txt mappings_temp.json

        if [ $? -ne 0 ]; then
          echo "ERROR: Node.js processing failed"
          exit 1
        fi

        echo "DEBUG: Node.js processing completed"

    - name: Verify mapping was stored
      run: |
        echo "DEBUG: Verifying mapping was stored"
        if [ -f "public/url-mappings.json" ]; then
          echo "url-mappings.json exists"
          echo "DEBUG: File size: $(wc -c < public/url-mappings.json)"
          echo "DEBUG: Content preview:"
          head -20 public/url-mappings.json
          echo "DEBUG: Looking for short code: ${{ github.event.inputs.shortCode }}"
          if grep -q "${{ github.event.inputs.shortCode }}" public/url-mappings.json; then
            echo "Short code found in mappings ✓"
          else
            echo "Short code NOT found in mappings ✗"
            exit 1
          fi
        else
          echo "url-mappings.json was NOT created"
          exit 1
        fi

    - name: Commit and push changes
      run: |
        echo "DEBUG: Starting commit and push"
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        git add public/url-mappings.json
        git status

        if git diff --staged --quiet; then
          echo "DEBUG: No changes to commit"
        else
          echo "DEBUG: Committing changes"
          git commit -m "Add URL mapping: ${{ github.event.inputs.shortCode }}"
          echo "DEBUG: Pushing to repository"
          git push
        fi

    - name: Pull latest changes and build React app
      run: |
        echo "DEBUG: Pulling latest changes and building React app"
        git pull origin main

        # Setup Node.js and build
        npm ci

        # Ensure url-mappings.json is copied to dist before build
        echo "DEBUG: Ensuring url-mappings.json is available for build"

        npm run build
        echo "DEBUG: React app built successfully"

        # Copy the updated url-mappings.json to the dist folder
        cp public/url-mappings.json dist/url-mappings.json
        echo "DEBUG: Copied updated url-mappings.json to dist folder"

    - name: Deploy to GitHub Pages
      if: success()
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        keep_files: true

    - name: Final status
      if: always()
      run: |
        echo "DEBUG: Final workflow status"
        echo "Job status: ${{ job.status }}"