name: Debug Metadata Issue

on:
  workflow_dispatch:
    inputs:
      metadata:
        description: 'Metadata input'
        required: true
        type: string
        default: '{generatorVersion:2.1,variableCount:20,complexity:17,industry:Cuero Premium,hasCustomContent:true,company:Bombilla de Cuero,readerName:Jose}'

jobs:
  debug-metadata:
    runs-on: ubuntu-latest
    steps:
    - name: Step 1 - Show raw input
      run: |
        echo "Raw metadata input:"
        echo "${{ github.event.inputs.metadata }}"

    - name: Step 2 - Test variable assignment with quotes
      run: |
        echo "Testing variable assignment..."
        METADATA_TEST='${{ github.event.inputs.metadata }}'
        echo "METADATA_TEST=$METADATA_TEST"

    - name: Step 3 - Test export with quotes
      run: |
        echo "Testing export..."
        METADATA_EXPORT='${{ github.event.inputs.metadata }}'
        export METADATA_EXPORT="$METADATA_EXPORT"
        echo "Export successful: $METADATA_EXPORT"

    - name: Step 4 - Test Node.js access
      run: |
        echo "Testing Node.js access..."
        METADATA_NODE='${{ github.event.inputs.metadata }}'
        export METADATA_NODE="$METADATA_NODE"
        node -e "console.log('Node sees:', process.env.METADATA_NODE)"