name: URL Shortener API

on:
  workflow_dispatch:
    inputs:
      shortCode:
        description: 'Short code (alphanumeric only, max 20 chars)'
        required: true
        type: string
      longUrl:
        description: 'Long URL to redirect to (must start with http:// or https://)'
        required: true
        type: string
      expirationHours:
        description: 'Expiration in hours (1-168, default: 72)'
        required: false
        type: string
        default: '72'
      metadata:
        description: 'Metadata (JSON format, max 1000 chars)'
        required: false
        type: string
        default: '{}'

jobs:
  store-mapping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
    - name: Debug - Show workflow inputs
      run: |
        echo "DEBUG: Workflow Inputs"
        echo "Short Code: ${{ github.event.inputs.shortCode }}"
        echo "Long URL: ${{ github.event.inputs.longUrl }}"
        echo "Expiration Hours: ${{ github.event.inputs.expirationHours }}"
        echo "Metadata: '${{ github.event.inputs.metadata }}'"
        echo "Repository: ${{ github.repository }}"
        echo "Ref: ${{ github.ref }}"
        echo "Actor: ${{ github.actor }}"

    - name: Validate and sanitize inputs
      run: |
        echo "DEBUG: Validating inputs"

        # Sanitize short code
        SHORT_CODE="${{ github.event.inputs.shortCode }}"
        SHORT_CODE=$(echo "$SHORT_CODE" | sed 's/[^a-zA-Z0-9_-]//g' | head -c 20)

        # Validate short code
        if [[ -z "$SHORT_CODE" ]]; then
          echo "ERROR: Short code cannot be empty"
          exit 1
        fi
        if [[ ! "$SHORT_CODE" =~ ^[a-zA-Z0-9_-]+$ ]]; then
          echo "ERROR: Short code contains invalid characters"
          exit 1
        fi

        # Validate long URL
        LONG_URL="${{ github.event.inputs.longUrl }}"
        if [[ ! "$LONG_URL" =~ ^https?:// ]]; then
          echo "ERROR: Long URL must start with http:// or https://"
          exit 1
        fi

        # Validate expiration hours
        EXPIRATION_HOURS="${{ github.event.inputs.expirationHours }}"
        if [[ ! "$EXPIRATION_HOURS" =~ ^[0-9]+$ ]] || [ "$EXPIRATION_HOURS" -lt 1 ] || [ "$EXPIRATION_HOURS" -gt 168 ]; then
          echo "ERROR: Expiration hours must be between 1 and 168"
          exit 1
        fi

        # Validate metadata length
        RAW_METADATA='${{ github.event.inputs.metadata }}'
        if [ ${#RAW_METADATA} -gt 1000 ]; then
          echo "ERROR: Metadata too long (max 1000 characters)"
          exit 1
        fi

        # Base64 encode metadata to avoid shell interpretation issues
        METADATA_ENCODED=$(echo -n "$RAW_METADATA" | base64 -w 0)

        # Set environment variables for next steps
        echo "SHORT_CODE=$SHORT_CODE" >> $GITHUB_ENV
        echo "LONG_URL=$LONG_URL" >> $GITHUB_ENV
        echo "EXPIRATION_HOURS=$EXPIRATION_HOURS" >> $GITHUB_ENV
        echo "METADATA_ENCODED=$METADATA_ENCODED" >> $GITHUB_ENV

        echo "DEBUG: Validation passed"
        echo "DEBUG: Sanitized SHORT_CODE: $SHORT_CODE"
        echo "DEBUG: Sanitized LONG_URL: $LONG_URL"

    - name: Checkout repository
      uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@1e60f620b9541d16f28e01576558c4f2f0d7ce1f # v4.1.0
      with:
        node-version: '20'
        cache: 'npm'

    - name: Debug - Show repository structure
      run: |
        echo "DEBUG: Repository Structure"
        pwd
        ls -la
        echo "DEBUG: Public directory"
        ls -la public/ || echo "Public directory not found"
        echo "DEBUG: Check for url-mappings.json"
        if [ -f "public/url-mappings.json" ]; then
          echo "url-mappings.json exists"
          head -20 public/url-mappings.json
        else
          echo "url-mappings.json NOT found"
        fi

    - name: Store URL mapping
      run: |
        echo "DEBUG: Starting URL mapping storage"

        # Use validated and sanitized environment variables
        SHORT_CODE="${{ env.SHORT_CODE }}"
        LONG_URL="${{ env.LONG_URL }}"
        EXPIRATION_HOURS="${{ env.EXPIRATION_HOURS }}"

        # Decode base64 metadata
        METADATA=$(echo "${{ env.METADATA_ENCODED }}" | base64 -d)

        echo "DEBUG: Parsed inputs"
        echo "SHORT_CODE: $SHORT_CODE"
        echo "LONG_URL: $LONG_URL"
        echo "EXPIRATION_HOURS: $EXPIRATION_HOURS"
        echo "METADATA: '$METADATA'"

        # Validate inputs
        if [ -z "$SHORT_CODE" ] || [ -z "$LONG_URL" ]; then
          echo "ERROR: Missing required inputs"
          exit 1
        fi

        # Calculate expiration
        EXPIRES_AT=$(node -e "console.log(Date.now() + (${EXPIRATION_HOURS} * 60 * 60 * 1000))")
        echo "DEBUG: Expiration timestamp: $EXPIRES_AT"
        echo "DEBUG: Expiration date: $(node -e "console.log(new Date(${EXPIRES_AT}).toISOString())")"

        # Read current mappings
        MAPPINGS_FILE="public/url-mappings.json"
        echo "DEBUG: Checking mappings file: $MAPPINGS_FILE"

        if [ -f "$MAPPINGS_FILE" ]; then
          echo "DEBUG: Reading existing mappings"
          MAPPINGS=$(cat "$MAPPINGS_FILE")
          echo "DEBUG: Current mappings size: $(echo "$MAPPINGS" | wc -c)"
        else
          echo "DEBUG: Creating new mappings file"
          MAPPINGS='{"mappings": {}, "lastUpdated": 0, "version": "1.0", "statistics": {"totalMappings": 0, "activeMappings": 0, "expiredMappings": 0}}'
          mkdir -p public
        fi

        # Create simple Node script using echo to avoid heredoc issues
        echo 'const fs = require("fs");' > process_mappings.js
        echo 'const mappings = JSON.parse(process.env.MAPPINGS);' >> process_mappings.js
        echo 'const shortCode = process.env.SHORT_CODE;' >> process_mappings.js
        echo 'const longUrl = process.env.LONG_URL;' >> process_mappings.js
        echo 'const expiresAt = parseInt(process.env.EXPIRES_AT);' >> process_mappings.js
        echo '' >> process_mappings.js
        echo 'let metadata;' >> process_mappings.js
        echo 'try {' >> process_mappings.js
        echo '  metadata = JSON.parse(process.env.METADATA || "{}");' >> process_mappings.js
        echo '} catch (error) {' >> process_mappings.js
        echo '  console.log("DEBUG: JSON parse failed, trying JavaScript evaluation");' >> process_mappings.js
        echo '  console.log("DEBUG: Metadata input:", process.env.METADATA);' >> process_mappings.js
        echo '  try {' >> process_mappings.js
        echo '    // Use Function constructor for safer evaluation' >> process_mappings.js
        echo '    const jsObject = new Function("return " + process.env.METADATA)();' >> process_mappings.js
        echo '    metadata = jsObject;' >> process_mappings.js
        echo '    console.log("DEBUG: Successfully evaluated metadata as JavaScript object");' >> process_mappings.js
        echo '  } catch (fallbackError) {' >> process_mappings.js
        echo '    console.log("WARNING: Could not parse metadata, using empty object");' >> process_mappings.js
        echo '    console.log("DEBUG: Original METADATA value:", process.env.METADATA);' >> process_mappings.js
        echo '    metadata = {};' >> process_mappings.js
        echo '  }' >> process_mappings.js
        echo '}' >> process_mappings.js
        echo '' >> process_mappings.js
        echo 'console.log("DEBUG: Starting Node.js processing");' >> process_mappings.js
        echo 'console.log("DEBUG: Current mappings count:", Object.keys(mappings.mappings).length);' >> process_mappings.js
        echo '' >> process_mappings.js
        echo '// Add new mapping' >> process_mappings.js
        echo 'mappings.mappings[shortCode] = {' >> process_mappings.js
        echo '  shortCode: shortCode,' >> process_mappings.js
        echo '  longUrl: longUrl,' >> process_mappings.js
        echo '  createdAt: Date.now(),' >> process_mappings.js
        echo '  expiresAt: expiresAt,' >> process_mappings.js
        echo '  metadata: metadata' >> process_mappings.js
        echo '};' >> process_mappings.js
        echo 'mappings.lastUpdated = Date.now();' >> process_mappings.js
        echo '' >> process_mappings.js
        echo '// Update statistics' >> process_mappings.js
        echo 'const now = Date.now();' >> process_mappings.js
        echo 'let activeCount = 0;' >> process_mappings.js
        echo 'let expiredCount = 0;' >> process_mappings.js
        echo '' >> process_mappings.js
        echo 'Object.values(mappings.mappings).forEach(mapping => {' >> process_mappings.js
        echo '  if (now > mapping.expiresAt) {' >> process_mappings.js
        echo '    expiredCount++;' >> process_mappings.js
        echo '  } else {' >> process_mappings.js
        echo '    activeCount++;' >> process_mappings.js
        echo '  }' >> process_mappings.js
        echo '});' >> process_mappings.js
        echo '' >> process_mappings.js
        echo 'mappings.statistics = {' >> process_mappings.js
        echo '  totalMappings: Object.keys(mappings.mappings).length,' >> process_mappings.js
        echo '  activeMappings: activeCount,' >> process_mappings.js
        echo '  expiredMappings: expiredCount' >> process_mappings.js
        echo '};' >> process_mappings.js
        echo '' >> process_mappings.js
        echo '// Write updated mappings' >> process_mappings.js
        echo 'fs.writeFileSync("public/url-mappings.json", JSON.stringify(mappings, null, 2));' >> process_mappings.js
        echo '' >> process_mappings.js
        echo 'console.log("URL mapping stored successfully");' >> process_mappings.js
        echo 'console.log("Short code:", shortCode);' >> process_mappings.js
        echo 'console.log("Long URL:", longUrl);' >> process_mappings.js
        echo 'console.log("Expires at:", new Date(expiresAt).toISOString());' >> process_mappings.js
        echo 'console.log("Total mappings:", Object.keys(mappings.mappings).length);' >> process_mappings.js
        echo 'console.log("Active mappings:", activeCount);' >> process_mappings.js

        # Run Node script
        export MAPPINGS="$MAPPINGS"
        export SHORT_CODE="$SHORT_CODE"
        export LONG_URL="$LONG_URL"
        export EXPIRES_AT="$EXPIRES_AT"
        export METADATA='$METADATA'

        node process_mappings.js

        if [ $? -ne 0 ]; then
          echo "ERROR: Node.js processing failed"
          exit 1
        fi

        echo "DEBUG: Node.js processing completed"

    - name: Debug - Verify mapping was stored
      run: |
        echo "DEBUG: Verifying mapping was stored"
        if [ -f "public/url-mappings.json" ]; then
          echo "url-mappings.json exists"
          echo "DEBUG: File size: $(wc -c < public/url-mappings.json)"
          echo "DEBUG: Content preview:"
          head -30 public/url-mappings.json
          echo "DEBUG: Looking for short code: ${{ env.SHORT_CODE }}"
          if grep -q "${{ env.SHORT_CODE }}" public/url-mappings.json; then
            echo "Short code found in mappings"
            echo "DEBUG: Mapping verification successful"
          else
            echo "Short code NOT found in mappings"
            exit 1
          fi
        else
          echo "url-mappings.json was NOT created"
          exit 1
        fi

    - name: Commit and push changes
      run: |
        echo "DEBUG: Starting commit and push"
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        git add public/url-mappings.json
        git status

        if git diff --staged --quiet; then
          echo "DEBUG: No changes to commit"
        else
          echo "DEBUG: Committing changes"
          git commit -m "Add URL mapping: ${{ env.SHORT_CODE }}"
          echo "DEBUG: Pushing to repository"
          git push
        fi

    - name: Deploy to GitHub Pages
      if: success()
      uses: peaceiris/actions-gh-pages@4f9cc6600d4bf148f4c5980e0e7e8722d642f18a # v4.0.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        keep_files: true

    - name: Debug - Final status
      if: always()
      run: |
        echo "DEBUG: Final workflow status"
        echo "Job status: ${{ job.status }}"