<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Actions Workflow Tester</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #ffffff;
            min-height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: #ffffff;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 14px;
        }
        button {
            background: #4f46e5;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 10px;
        }
        button:hover {
            background: #3730a3;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
        }
        .success {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
        }
        .error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
        }
        .info {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid #3b82f6;
        }
        .warning {
            background: rgba(245, 158, 11, 0.2);
            border: 1px solid #f59e0b;
        }
        .step {
            background: rgba(79, 70, 229, 0.1);
            border: 1px solid #4f46e5;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .step h3 {
            margin-top: 0;
            color: #4f46e5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 GitHub Actions Workflow Tester</h1>

        <div class="step">
            <h3>Step 1: Repository Information</h3>
            <div class="form-group">
                <label for="owner">GitHub Username/Owner:</label>
                <input type="text" id="owner" placeholder="your-username">
            </div>
            <div class="form-group">
                <label for="repo">Repository Name:</label>
                <input type="text" id="repo" placeholder="your-repo">
            </div>
            <div class="form-group">
                <label for="token">GitHub Personal Access Token:</label>
                <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx">
                <small style="color: #888; display: block; margin-top: 5px;">
                    Create token at: https://github.com/settings/tokens<br>
                    Required scopes: repo (full control), workflow
                </small>
            </div>
        </div>

        <div class="step">
            <h3>Step 2: Test Mapping Data</h3>
            <div class="form-group">
                <label for="testShortCode">Test Short Code:</label>
                <input type="text" id="testShortCode" value="TEST123" placeholder="TEST123">
            </div>
            <div class="form-group">
                <label for="testLongUrl">Test Long URL:</label>
                <input type="text" id="testLongUrl" value="https://example.com/test" placeholder="https://example.com/test">
            </div>
            <div class="form-group">
                <label for="testExpiration">Expiration Hours:</label>
                <input type="number" id="testExpiration" value="1" min="1" max="168">
                <small style="color: #888; display: block; margin-top: 5px;">
                    Use 1 hour for testing
                </small>
            </div>
        </div>

        <div class="step">
            <h3>Step 3: Run Tests</h3>
            <button onclick="testGitHubConnection()">🔗 Test GitHub Connection</button>
            <button onclick="triggerWorkflow()">🚀 Trigger Workflow</button>
            <button onclick="checkMappingsFile()">📋 Check Mappings File</button>
            <button onclick="testDirectAccess()">🌐 Test Direct Access</button>
            <button onclick="clearResults()">🧹 Clear Results</button>
        </div>

        <div id="results"></div>
    </div>

    <script>
        function addResult(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            results.appendChild(div);
            results.scrollTop = results.scrollHeight;
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        async function testGitHubConnection() {
            const owner = document.getElementById('owner').value;
            const repo = document.getElementById('repo').value;
            const token = document.getElementById('token').value;

            if (!owner || !repo || !token) {
                addResult('❌ Please fill in all repository information fields', 'error');
                return;
            }

            addResult('🔍 Testing GitHub connection...', 'info');

            try {
                // Test basic authentication
                const authResponse = await fetch(`https://api.github.com/user`, {
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (!authResponse.ok) {
                    throw new Error(`Auth failed: ${authResponse.status} ${authResponse.statusText}`);
                }

                const userData = await authResponse.json();
                addResult(`✅ Authentication successful. User: ${userData.login}`, 'success');

                // Test repository access
                const repoResponse = await fetch(`https://api.github.com/repos/${owner}/${repo}`, {
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (!repoResponse.ok) {
                    throw new Error(`Repo access failed: ${repoResponse.status} ${repoResponse.statusText}`);
                }

                const repoData = await repoResponse.json();
                addResult(`✅ Repository access successful. Name: ${repoData.name}, Private: ${repoData.private}`, 'success');

                // Test workflow trigger endpoint
                const workflowResponse = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/workflows/url-shortener.yml/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        ref: 'main'
                    })
                });

                if (workflowResponse.status === 204) {
                    addResult('✅ Workflow trigger endpoint accessible', 'success');
                } else if (workflowResponse.status === 404) {
                    addResult('⚠️ Workflow file not found at .github/workflows/url-shortener.yml', 'warning');
                } else {
                    addResult(`⚠️ Workflow trigger returned: ${workflowResponse.status} ${workflowResponse.statusText}`, 'warning');
                }

            } catch (error) {
                addResult(`❌ Connection test failed: ${error.message}`, 'error');
            }
        }

        async function triggerWorkflow() {
            const owner = document.getElementById('owner').value;
            const repo = document.getElementById('repo').value;
            const token = document.getElementById('token').value;
            const shortCode = document.getElementById('testShortCode').value;
            const longUrl = document.getElementById('testLongUrl').value;
            const expiration = document.getElementById('testExpiration').value;

            if (!owner || !repo || !token || !shortCode || !longUrl) {
                addResult('❌ Please fill in all fields', 'error');
                return;
            }

            addResult('🚀 Triggering GitHub Actions workflow...', 'info');

            try {
                const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/workflows/url-shortener.yml/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        ref: 'main',
                        inputs: {
                            shortCode: shortCode,
                            longUrl: longUrl,
                            expirationHours: expiration,
                            metadata: JSON.stringify({test: true, timestamp: Date.now()})
                        }
                    })
                });

                if (response.ok || response.status === 204) {
                    addResult(`✅ Workflow triggered successfully! Short code: ${shortCode}`, 'success');
                    addResult('📋 Check the Actions tab in your GitHub repository to see the workflow run', 'info');
                    addResult('⏰ The mapping should be available in 1-2 minutes', 'info');
                } else {
                    const errorData = await response.json();
                    addResult(`❌ Workflow trigger failed: ${response.status} ${response.statusText}`, 'error');
                    addResult(`Details: ${JSON.stringify(errorData, null, 2)}`, 'error');
                }
            } catch (error) {
                addResult(`❌ Failed to trigger workflow: ${error.message}`, 'error');
            }
        }

        async function checkMappingsFile() {
            const owner = document.getElementById('owner').value;
            const repo = document.getElementById('repo').value;

            if (!owner || !repo) {
                addResult('❌ Please fill in repository information', 'error');
                return;
            }

            addResult('📋 Checking url-mappings.json file...', 'info');

            try {
                // Try different possible URLs for the mappings file
                const possibleUrls = [
                    `https://${owner}.github.io/${repo}/url-mappings.json`,
                    `https://raw.githubusercontent.com/${owner}/${repo}/main/public/url-mappings.json`,
                    `https://raw.githubusercontent.com/${owner}/${repo}/gh-pages/url-mappings.json`,
                    `${window.location.origin}/url-mappings.json`
                ];

                let found = false;
                for (const url of possibleUrls) {
                    try {
                        const response = await fetch(url);
                        if (response.ok) {
                            const data = await response.json();
                            addResult(`✅ Found mappings file at: ${url}`, 'success');
                            addResult(`📊 Total mappings: ${data.statistics?.totalMappings || 'Unknown'}`, 'info');
                            addResult(`📈 Active mappings: ${data.statistics?.activeMappings || 'Unknown'}`, 'info');

                            // Check if our test code exists
                            const testCode = document.getElementById('testShortCode').value;
                            if (data.mappings && data.mappings[testCode]) {
                                const mapping = data.mappings[testCode];
                                addResult(`✅ Test mapping found: ${testCode} -> ${mapping.longUrl}`, 'success');
                                addResult(`⏰ Expires: ${new Date(mapping.expiresAt).toLocaleString()}`, 'info');
                            } else {
                                addResult(`⚠️ Test mapping ${testCode} not found in file`, 'warning');
                            }

                            found = true;
                            break;
                        }
                    } catch (e) {
                        // Try next URL
                        continue;
                    }
                }

                if (!found) {
                    addResult('❌ url-mappings.json not found at any expected location', 'error');
                    addResult('🔍 Checked URLs:', 'error');
                    possibleUrls.forEach(url => addResult(`  - ${url}`, 'error'));
                }
            } catch (error) {
                addResult(`❌ Failed to check mappings file: ${error.message}`, 'error');
            }
        }

        async function testDirectAccess() {
            const shortCode = document.getElementById('testShortCode').value;
            if (!shortCode) {
                addResult('❌ Please enter a test short code', 'error');
                return;
            }

            addResult(`🌐 Testing direct access to short code: ${shortCode}`, 'info');

            try {
                const response = await fetch(`${window.location.origin}/#/r/${shortCode}`);
                addResult(`📡 Response status: ${response.status} ${response.statusText}`, 'info');

                // Also test the redirect handler directly
                const testUrl = `${window.location.origin}/r/${shortCode}`;
                addResult(`🔗 Testing URL: ${testUrl}`, 'info');

                // Open in new window for manual testing
                window.open(testUrl, '_blank');

            } catch (error) {
                addResult(`❌ Direct access test failed: ${error.message}`, 'error');
            }
        }

        // Auto-detect repository info if on GitHub Pages
        window.addEventListener('load', function() {
            const hostname = window.location.hostname;
            if (hostname.includes('github.io')) {
                const pathname = window.location.pathname;
                const pathSegments = pathname.split('/').filter(segment => segment.length > 0);
                const owner = hostname.replace('.github.io', '');
                const repo = pathSegments.length > 0 ? pathSegments[0] : owner;

                document.getElementById('owner').value = owner;
                document.getElementById('repo').value = repo;

                addResult(`🔍 Auto-detected repository: ${owner}/${repo}`, 'info');
            }
        });
    </script>
</body>
</html>
