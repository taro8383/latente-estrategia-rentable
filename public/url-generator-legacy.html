<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de URLs Personalizadas - Latente (Legacy)</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 20px; 
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #ffffff;
            min-height: 100vh;
        }
        .container { 
            background: rgba(255, 255, 255, 0.1); 
            border-radius: 12px; 
            padding: 30px; 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 { 
            color: #ffffff; 
            text-align: center; 
            margin-bottom: 30px; 
            font-size: 2.5em;
            font-weight: 700;
        }
        .form-group { 
            margin-bottom: 20px; 
        }
        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 600; 
            color: #e2e8f0;
            font-size: 14px;
        }
        input, textarea, select { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #444; 
            border-radius: 6px; 
            background: #2d2d2d; 
            color: #ffffff; 
            font-size: 14px;
            box-sizing: border-box;
        }
        input:focus, textarea:focus, select:focus {
            outline: none; 
            border-color: #4f46e5; 
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.3);
        }
        button { 
            background: linear-gradient(45deg, #ff6b35, #f72b1b); 
            color: white; 
            padding: 12px 24px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        button:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.4);
        }
        .result { 
            margin-top: 30px; 
            padding: 20px; 
            background: rgba(79, 70, 229, 0.1); 
            border-radius: 8px; 
            border: 1px solid #4f46e5;
            word-break: break-all;
        }
        .result h3 {
            color: #4f46e5;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .result-url {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            border: 1px solid #444;
            margin: 10px 0;
        }
        .copy-btn {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
        }
        .copy-btn:hover {
            background: #3d4452;
        }
        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .preview-section {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border: 1px solid #444;
        }
        .preview-json {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }
        .logo-upload-section {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border: 1px solid #444;
        }
        .logo-preview {
            margin-top: 15px;
            text-align: center;
        }
        .logo-preview img {
            max-width: 200px;
            max-height: 100px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #1a1a1a;
        }
        .remove-logo-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
        }
        .remove-logo-btn:hover {
            background: #b91c1c;
        }
        .form-errors {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #dc2626;
            color: #dc2626;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
        }
        .form-errors h4 {
            color: #dc2626;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .form-errors ul {
            list-style: disc;
            margin-left: 20px;
        }
        .form-errors li {
            margin-bottom: 4px;
        }
        @media (max-width: 600px) {
            .two-column {
                grid-template-columns: 1fr;
            }
            .result-section {
                grid-template-columns: 1fr !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔗 Generador de URLs Personalizadas (Legacy)</h1>
        
        <form id="generatorForm">
            <div class="form-group">
                <label for="readerName">Nombre del Lector:</label>
                <input type="text" id="readerName" value="Juan" required>
            </div>
            
            <div class="form-group">
                <label for="company">Empresa:</label>
                <input type="text" id="company" value="Luxury Holdings" required>
            </div>
            
            <div class="form-group">
                <label for="industry">Industria (personalizable):</label>
                <input type="text" id="industry" placeholder="Ej: Tecnología, Salud, Finanzas, Educación..." list="industry-suggestions" required>
                <datalist id="industry-suggestions">
                    <option value="Moda de Lujo">
                    <option value="Cuero Premium">
                    <option value="Tecnología">
                    <option value="Salud">
                    <option value="Finanzas">
                    <option value="Bienes Raíces">
                    <option value="Automotriz">
                    <option value="Educación">
                    <option value="Retail">
                    <option value="Manufactura">
                    <option value="Consultoría">
                    <option value="Servicios Profesionales">
                    <option value="Turismo">
                    <option value="Entretenimiento">
                    <option value="Medios">
                    <option value="Construcción">
                    <option value="Energía">
                    <option value="Telecomunicaciones">
                    <option value="Agricultura">
                    <option value="Alimentos y Bebidas">
                    <option value="Transporte">
                    <option value="Logística">
                </datalist>
            </div>
            
            <div class="form-group">
                <label for="location">Ubicación:</label>
                <input type="text" id="location" value="Nueva York" required>
            </div>
            
            <div class="form-group">
                <label for="keywords">Palabras Clave de la Industria (separadas por comas):</label>
                <input type="text" id="keywords" value="billeteras premium, cuero artesanal, diseño exclusivo" required>
            </div>
            
            <div class="form-group">
                <label for="validHours">Vigencia en horas:</label>
                <select id="validHours">
                    <option value="24">24 horas</option>
                    <option value="48">48 horas</option>
                    <option value="72" selected>72 horas</option>
                    <option value="168">1 semana</option>
                </select>
            </div>
            
            <div class="logo-upload-section">
                <label for="logoUpload">📷 Subir logo de la empresa (opcional):</label>
                <input type="file" id="logoUpload" accept="image/*" onchange="handleLogoUpload(event)">
                <div id="logoPreview" class="logo-preview" style="display: none;">
                    <img id="logoImage" src="" alt="Logo preview">
                    <br>
                    <button type="button" class="remove-logo-btn" onclick="removeLogo()">❌ Eliminar logo</button>
                </div>
            </div>
            
            <button type="submit">🚀 Generar URL Personalizada</button>
        </form>
        
        <div id="result" class="result" style="display: none;">
            <div class="result-section" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                <div class="result-box">
                    <h3>🔗 URL Corta (para emails)</h3>
                    <div class="result-url" id="shortUrl"></div>
                    <button class="copy-btn" onclick="copyToClipboard('shortUrl')">📋 Copiar URL Corta</button>
                </div>
                <div class="result-box">
                    <h3>🔗 URL Larga (completa)</h3>
                    <div class="result-url" id="longUrl"></div>
                    <button class="copy-btn" onclick="copyToClipboard('longUrl')">📋 Copiar URL Larga</button>
                </div>
            </div>
            <div class="stats-box" id="urlStats" style="grid-column: 1 / -1; background: rgba(79, 70, 229, 0.1); border: 1px solid #4f46e5; border-radius: 8px; padding: 20px; margin-top: 10px;"></div>
        </div>
        
        <div id="preview" class="preview-section" style="display: none;">
            <h3>📋 Vista Previa de Datos</h3>
            <div class="preview-json" id="previewJson"></div>
        </div>
    </div>

    <script>
        let companyLogoData = null;
        let companyLogoId = null;

        // URL Shortener Utility
        class URLShortener {
            static STORAGE_KEY = 'url_mappings';
            static DEFAULT_LENGTH = 6;
            static ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';

            static generateShortCode(length = this.DEFAULT_LENGTH) {
                let result = '';
                for (let i = 0; i < length; i++) {
                    result += this.ALPHABET.charAt(Math.floor(Math.random() * this.ALPHABET.length));
                }
                return result;
            }

            static getMappings() {
                try {
                    const stored = localStorage.getItem(this.STORAGE_KEY);
                    return stored ? JSON.parse(stored) : {};
                } catch (error) {
                    console.error('Failed to parse URL mappings:', error);
                    return {};
                }
            }

            static saveMappings(mappings) {
                try {
                    localStorage.setItem(this.STORAGE_KEY, JSON.stringify(mappings));
                } catch (error) {
                    console.error('Failed to save URL mappings:', error);
                    this.cleanupExpired();
                    try {
                        localStorage.setItem(this.STORAGE_KEY, JSON.stringify(mappings));
                    } catch (retryError) {
                        console.error('Failed to save mappings even after cleanup:', retryError);
                    }
                }
            }

            static cleanupExpired() {
                const mappings = this.getMappings();
                const now = Date.now();
                let hasChanges = false;

                Object.keys(mappings).forEach(shortCode => {
                    if (now > mappings[shortCode].expiresAt) {
                        delete mappings[shortCode];
                        hasChanges = true;
                    }
                });

                if (hasChanges) {
                    this.saveMappings(mappings);
                }
            }

            static storeMapping(shortCode, longUrl, expirationHours = 72) {
                const mapping = {
                    shortCode,
                    longUrl,
                    createdAt: Date.now(),
                    expiresAt: Date.now() + (expirationHours * 60 * 60 * 1000)
                };

                const mappings = this.getMappings();
                mappings[shortCode] = mapping;
                this.saveMappings(mappings);
            }

            static getLongUrl(shortCode) {
                const mappings = this.getMappings();
                const mapping = mappings[shortCode];

                if (!mapping) {
                    return null;
                }

                if (Date.now() > mapping.expiresAt) {
                    delete mappings[shortCode];
                    this.saveMappings(mappings);
                    return null;
                }

                return mapping.longUrl;
            }

            static generateShortUrl(longUrl, expirationHours = 72) {
                this.cleanupExpired();
                
                let shortCode;
                const mappings = this.getMappings();
                
                do {
                    shortCode = this.generateShortCode();
                } while (mappings[shortCode]);

                this.storeMapping(shortCode, longUrl, expirationHours);

                const isProduction = window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1';
                const baseUrl = window.location.origin + (isProduction ? '/' : '/');
                return `${baseUrl}r/${shortCode}`;
            }
        }

        // Logo Storage Utility (simplified version for HTML)
        class LogoStorage {
            static STORAGE_KEY = 'personalized_logos';
            
            static storeLogo(id, base64Data, hoursValid = 72) {
                try {
                    const logos = this.getLogos();
                    logos[id] = {
                        data: base64Data,
                        timestamp: Date.now(),
                        expiresAt: Date.now() + (hoursValid * 60 * 60 * 1000)
                    };
                    localStorage.setItem(this.STORAGE_KEY, JSON.stringify(logos));
                } catch (error) {
                    console.warn('Failed to store logo:', error);
                    this.cleanupExpired();
                    try {
                        const logos = this.getLogos();
                        logos[id] = {
                            data: base64Data,
                            timestamp: Date.now(),
                            expiresAt: Date.now() + (hoursValid * 60 * 60 * 1000)
                        };
                        localStorage.setItem(this.STORAGE_KEY, JSON.stringify(logos));
                    } catch (retryError) {
                        console.error('Failed to store logo even after cleanup:', retryError);
                    }
                }
            }
            
            static getLogos() {
                try {
                    const stored = localStorage.getItem(this.STORAGE_KEY);
                    return stored ? JSON.parse(stored) : {};
                } catch (error) {
                    console.error('Failed to parse stored logos:', error);
                    return {};
                }
            }
            
            static cleanupExpired() {
                try {
                    const logos = this.getLogos();
                    const now = Date.now();
                    let hasChanges = false;
                    
                    Object.keys(logos).forEach(id => {
                        if (now > logos[id].expiresAt) {
                            delete logos[id];
                            hasChanges = true;
                        }
                    });
                    
                    if (hasChanges) {
                        localStorage.setItem(this.STORAGE_KEY, JSON.stringify(logos));
                    }
                } catch (error) {
                    console.error('Failed to cleanup expired logos:', error);
                }
            }
            
            static generateLogoId() {
                return `logo_${Date.now()}_${Math.random().toString(36).substring(2, 9)}`;
            }
        }

        function base64EncodeUnicode(str) {
            // UTF-8-safe base64 encoder for JSON strings
            return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(match, p1) {
                return String.fromCharCode('0x' + p1);
            }));
        }

        function generateUniqueCode() {
            return Math.random().toString(36).substring(2, 15) +
                   Math.random().toString(36).substring(2, 15);
        }

        function handleLogoUpload(event) {
            const file = event.target.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    companyLogoData = e.target.result;
                    document.getElementById('logoImage').src = companyLogoData;
                    document.getElementById('logoPreview').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function removeLogo() {
            companyLogoData = null;
            companyLogoId = null;
            document.getElementById('logoUpload').value = '';
            document.getElementById('logoPreview').style.display = 'none';
        }

        function generatePersonalizedUrl(personalizationData, hoursValid = 72) {
            const now = new Date();
            const expiresAt = new Date(now.getTime() + (hoursValid * 60 * 60 * 1000));
            const uniqueCode = generateUniqueCode();
            
            // Handle logo storage
            let logoId = null;
            if (companyLogoData) {
                logoId = LogoStorage.generateLogoId();
                LogoStorage.storeLogo(logoId, companyLogoData, hoursValid);
                companyLogoId = logoId;
            }
            
            const dataWithExpiration = {
                brandInfo: {
                    name: personalizationData.company, // Use company as brand name
                    industry: personalizationData.industry,
                    productType: 'leather goods',
                    targetAudience: 'affluent professionals'
                },
                readerInfo: {
                    name: personalizationData.readerName,
                    company: personalizationData.company,
                    position: 'CEO', // Default since position field removed
                    location: personalizationData.location
                },
                industryKeywords: personalizationData.keywords.split(',').map(k => k.trim()),
                expiration: {
                    createdAt: now.toISOString(),
                    expiresAt: expiresAt.toISOString(),
                    uniqueCode
                },
                // Include companyLogo inline (base64) so recipients receive the logo even without localStorage.
                // Keep companyLogoId as a legacy/short-reference when available.
                companyLogo: companyLogoData || null,
                companyLogoId: logoId
            };
            
            const encodedData = base64EncodeUnicode(JSON.stringify(dataWithExpiration));
            // Use the same base path as Vite config for production
            const isProduction = window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1';
            const baseUrl = window.location.origin + (isProduction ? '/' : '/');
            // Use hash routing for GitHub Pages compatibility
            return `${baseUrl}#/invite/${uniqueCode}?data=${encodedData}`;
        }

        function copyToClipboard(elementId) {
            const urlText = document.getElementById(elementId).textContent;
            navigator.clipboard.writeText(urlText).then(() => {
                alert('✅ URL copiada al portapapeles!');
            }).catch(err => {
                console.error('Error al copiar:', err);
                alert('❌ Error al copiar la URL');
            });
        }

        function formatExpirationDate(expiresAt) {
            const date = new Date(expiresAt);
            return date.toLocaleString('es-ES', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Industry validation
        function validateIndustry(industry) {
            if (!industry || industry.trim().length < 2) {
                return 'Por favor ingresa una industria válida';
            }
            if (industry.length > 50) {
                return 'El nombre de industria es demasiado largo';
            }
            return null; // Valid
        }

        // Form validation
        function validateForm(data) {
            const errors = [];
            
            if (!data.readerName?.trim()) {
                errors.push('El nombre del lector es requerido');
            }
            
            if (!data.company?.trim()) {
                errors.push('La empresa es requerida');
            }
            
            if (!data.industry?.trim()) {
                errors.push('La industria es requerida');
            }
            
            const industryError = validateIndustry(data.industry);
            if (industryError) {
                errors.push(industryError);
            }
            
            return errors;
        }

        // Show validation errors
        function showErrors(errors) {
            const existingErrorDiv = document.getElementById('formErrors');
            if (existingErrorDiv) {
                existingErrorDiv.remove();
            }
            
            if (errors.length > 0) {
                const errorDiv = document.createElement('div');
                errorDiv.id = 'formErrors';
                errorDiv.className = 'form-errors';
                errorDiv.innerHTML = `
                    <h4>Por favor corrige los siguientes errores:</h4>
                    <ul>
                        ${errors.map(error => `<li>${error}</li>`).join('')}
                    </ul>
                `;
                
                const form = document.getElementById('generatorForm');
                form.parentNode.insertBefore(errorDiv, form);
            }
        }

        document.getElementById('generatorForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const personalizationData = {
                readerName: document.getElementById('readerName').value,
                company: document.getElementById('company').value,
                industry: document.getElementById('industry').value,
                location: document.getElementById('location').value,
                keywords: document.getElementById('keywords').value
            };
            
            // Validate form
            const errors = validateForm(personalizationData);
            if (errors.length > 0) {
                showErrors(errors);
                return;
            }
            
            // Clear any existing errors
            const existingErrorDiv = document.getElementById('formErrors');
            if (existingErrorDiv) {
                existingErrorDiv.remove();
            }
            
            const validHours = parseInt(document.getElementById('validHours').value);
            
            // Step 1: Generate long URL (existing functionality)
            const longUrl = generatePersonalizedUrl(personalizationData, validHours);
            
            // Step 2: Generate short URL (new functionality)
            const shortUrl = URLShortener.generateShortUrl(longUrl, validHours);
            
            // Display both URLs
            document.getElementById('shortUrl').textContent = shortUrl;
            document.getElementById('longUrl').textContent = longUrl;
            document.getElementById('result').style.display = 'block';
            
            // Show statistics
            const reductionPercent = Math.round((1 - shortUrl.length/longUrl.length) * 100);
            document.getElementById('urlStats').innerHTML = `
                <h4>📊 Estadísticas de URL</h4>
                <p><strong>URL Corta:</strong> ${shortUrl.length} caracteres</p>
                <p><strong>URL Larga:</strong> ${longUrl.length} caracteres</p>
                <p><strong>Reducción:</strong> ${reductionPercent}% más corta</p>
                <p><strong>Ahorro:</strong> ${longUrl.length - shortUrl.length} caracteres</p>
            `;
            
            // Show preview
            const previewData = {
                ...personalizationData,
                hasLogo: !!companyLogoData,
                logoId: companyLogoId,
                shortUrl: shortUrl,
                longUrl: longUrl,
                urlLengthReduction: `${reductionPercent}% shorter`,
                expiration: {
                    expiresAt: new Date(Date.now() + (validHours * 60 * 60 * 1000)).toISOString()
                }
            };
            document.getElementById('previewJson').textContent = JSON.stringify(previewData, null, 2);
            document.getElementById('preview').style.display = 'block';
            
            // Scroll to result
            document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
        });

        // Remove auto-generation to prevent refresh loop
        // Users can now manually generate URLs by clicking the button
    </script>
</body>
</html>
