<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirigiendo...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #ffffff;
        }
        .redirect-container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4f46e5;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <h1>🔗 Redirigiendo a tu página personalizada...</h1>
        <div class="spinner"></div>
        <p>Si no eres redirigido automáticamente, <a href="{LONG_URL}" style="color: #4f46e5;">haz clic aquí</a>.</p>
    </div>

    <script>
        // Immediate redirect with fallback
        (function() {
            const targetUrl = "{LONG_URL}";

            // Validate URL before redirecting
            try {
                const url = new URL(targetUrl);
                console.log('Redirecting to:', url.href);

                // Multiple redirect methods for maximum compatibility
                setTimeout(() => {
                    window.location.href = url.href;
                }, 100);

                // Fallback redirect
                setTimeout(() => {
                    window.location.replace(url.href);
                }, 500);

                // Final fallback
                setTimeout(() => {
                    window.location.assign(url.href);
                }, 1000);

            } catch (error) {
                console.error('Invalid redirect URL:', error);
                document.body.innerHTML = `
                    <div class="redirect-container">
                        <h1>❌ Error de Redirección</h1>
                        <p>La URL de redirección no es válida.</p>
                        <p>Por favor, contacta al administrador.</p>
                    </div>
                `;
            }
        })();
    </script>
</body>
</html>
