<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trigger Test Workflow</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        .result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button { padding: 10px 20px; margin: 5px; font-size: 16px; }
        input { width: 300px; padding: 8px; margin: 5px; }
        .container { background: #f8f9fa; padding: 20px; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 GitHub Actions Test Tool</h1>

        <div>
            <h3>GitHub Token:</h3>
            <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx" value="">
        </div>

        <div>
            <h3>Test Input (optional):</h3>
            <input type="text" id="testInput" placeholder="Enter test text" value="hello world">
        </div>

        <div>
            <button onclick="triggerBasicTest()">🧪 Trigger Basic Test</button>
            <button onclick="triggerUrlShortener()">🔗 Trigger URL Shortener</button>
            <button onclick="clearResults()">🧹 Clear Results</button>
        </div>

        <div id="results"></div>
    </div>

    <script>
        function addResult(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
            results.appendChild(div);
            results.scrollTop = results.scrollHeight;
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        async function triggerBasicTest() {
            const token = document.getElementById('token').value;
            const testInput = document.getElementById('testInput').value;

            if (!token) {
                addResult('❌ Please enter your GitHub token', 'error');
                return;
            }

            addResult('🧪 Triggering basic test workflow...', 'info');

            try {
                const response = await fetch(`https://api.github.com/repos/taro8383/latente-estrategia-rentable/actions/workflows/test-basic.yml/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        ref: 'main',
                        inputs: {
                            testInput: testInput || 'test'
                        }
                    })
                });

                if (response.ok || response.status === 204) {
                    addResult('✅ Basic test workflow triggered successfully!', 'success');
                    addResult('📋 Check the Actions tab in your GitHub repository', 'info');
                    addResult('🔍 This will test basic bash commands', 'info');
                } else {
                    const errorData = await response.json();
                    addResult(`❌ Basic test trigger failed: ${response.status} ${response.statusText}`, 'error');
                    addResult(`Details: ${JSON.stringify(errorData, null, 2)}`, 'error');
                }
            } catch (error) {
                addResult(`❌ Request error: ${error.message}`, 'error');
            }
        }

        async function triggerUrlShortener() {
            const token = document.getElementById('token').value;

            if (!token) {
                addResult('❌ Please enter your GitHub token', 'error');
                return;
            }

            addResult('🔗 Triggering URL shortener workflow...', 'info');

            try {
                const response = await fetch(`https://api.github.com/repos/taro8383/latente-estrategia-rentable/actions/workflows/url-shortener.yml/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        ref: 'main',
                        inputs: {
                            shortCode: 'BASIC' + Date.now().toString().slice(-6),
                            longUrl: 'https://example.com/test',
                            expirationHours: '1',
                            metadata: '{"test": true, "type": "basic-test"}'
                        }
                    })
                });

                if (response.ok || response.status === 204) {
                    addResult('✅ URL shortener workflow triggered successfully!', 'success');
                    addResult('📋 Check the Actions tab in your GitHub repository', 'info');
                    addResult('🔍 This will test with comprehensive debugging enabled', 'info');
                } else {
                    const errorData = await response.json();
                    addResult(`❌ URL shortener trigger failed: ${response.status} ${response.statusText}`, 'error');
                    addResult(`Details: ${JSON.stringify(errorData, null, 2)}`, 'error');
                }
            } catch (error) {
                addResult(`❌ Request error: ${error.message}`, 'error');
            }
        }

        // Auto-detect if we're on GitHub Pages
        window.addEventListener('load', function() {
            const hostname = window.location.hostname;
            if (hostname.includes('github.io')) {
                addResult('🔍 Running on GitHub Pages - workflows should be available', 'info');
            }
        });
    </script>
</body>
</html>
